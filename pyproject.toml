[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clams"
version = "2.0.0"
description = "Clams v2 — planner/executor/api over one SQLite DB and two Redis streams, driving unmodified Claudio agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
clams = "clams.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/contract", "tests/integration", "tests/chaos"]
addopts = "-q"
markers = [
    "live: tests that hit real external services (GitHub/Redis/Claudio)",
    "redis: tests that need a local Redis at CLAMS_REDIS_URL",
]
