worker_processes 2;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # The Planner Web UI and its SSE stream must never be buffered, or the
    # chat stream stalls until the response completes.
    proxy_request_buffering off;

    upstream planner_upstream {
        server planner:8080;
    }

    server {
        listen 80;

        # Web UI and SSE stream directed to Planner Agent
        location / {
            proxy_pass http://planner_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;          # Critical for real-time SSE streaming
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        location = /healthz {
            proxy_pass http://planner_upstream/healthz;
            proxy_buffering off;
        }
    }
}
