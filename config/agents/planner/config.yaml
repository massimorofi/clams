server:
  host: 0.0.0.0
  port: 8100
  auth_token: dev-token-change-me
  cors_origins:
  - http://localhost:8080
  - http://localhost:1076
  - http://localhost:1077
  - http://127.0.0.1:1076
  - http://127.0.0.1:1077
  - http://192.168.1.172:1076
  - http://192.168.1.172:1077
  expose_raw_config: false
llm:
  provider: openai
  model: halogen-qwen3.8-flash-next
  api_key: local
  base_url: http://192.168.1.172:8731/v1
  temperature: 0.2
  max_tokens: 16384
  context_window: null
  fallback_model: null
  timeout_seconds: 86400
  retry_attempts: 3
  price_input_per_mtok: 0
  price_output_per_mtok: 0
  reasoning_effort: ''
model_profiles:
  worker-halogen:
    label: Worker (halogen)
    provider: openai
    model: halogen-qwen3.8-flash-next
    base_url: http://192.168.1.172:8731/v1
    api_key: local
    temperature: 0.2
    max_tokens: 16384
    context_window: 262144
    price_input_per_mtok: 0
    price_output_per_mtok: 0
    timeout_seconds: 1800
    reasoning_effort: ''
  fast-halogen:
    label: Fast (halogen)
    provider: openai
    model: halogen-qwen3.8-flash-next
    base_url: http://192.168.1.172:8731/v1
    api_key: local
    temperature: 0.2
    max_tokens: 16384
    context_window: 262144
    price_input_per_mtok: 0
    price_output_per_mtok: 0
    timeout_seconds: 1800
    reasoning_effort: ''
roles:
  primary: null
  worker: worker-halogen
  fast: fast-halogen
agent:
  name: Planner
  instructions_file: instructions.md
  instructions: null
  max_turns: 150
  max_auto_continues: 10
  max_budget_usd: 100
  max_model_calls: 0
  max_run_seconds: 0
  max_run_tokens: 0
  reasoning_effort_high: ''
  reasoning_effort_low: ''
  approval_mode: 'off'
  # Clams never runs the host-executor side (no socket is mounted into this
  # container), so host execution can only ever fail with
  # "Host command execution failed: [Errno 2]". Commands run inside the agent
  # container; orchestrator visibility comes from the read-only Clams API via
  # the clams-control-plane skill (see skills_dir below).
  host_execution_enabled: false
  host_execution_socket: /run/claudio-host/host-exec.sock
  default_workspace_dir: /workspace
  workspace_allowed_roots:
  - /workspace
  context_window: 262144
  compaction_reserve: 8192
  compaction_timeout_seconds: 300
  max_output_chars: 8000
  strict_tools: false
  skills_enabled: true
  # absolute path inside the bind-mounted config dir (compose mounts
  # ./config/agents/planner here), so skills live in the repo and survive rebuilds
  skills_dir: /srv/claudio/claudio-backend/config/skills
  gortex_manifest_path: ''
  auto_routing_enabled: true
  router_deterministic_first: true
  max_read_concurrency: 4
  streaming_enabled: false
  subagent_approval_mode: one_gate
  tools:
    enabled:
    - read_file
    - list_dir
    - web_search
    - delegate_task
    - write_file
    - run_command
    - edit_file
    - web_fetch
    - rewind_files
    - todo_write
    disabled: []
  subagents:
    code_worker:
      description: Implements a narrow, well-scoped coding task in the workspace
      instructions_file: null
      instructions: Complete only the requested task. Inspect relevant files first,
        make the smallest necessary changes, and report files changed and checks run.
        Do not delegate, broaden scope, or run unrelated commands.
      tools:
      - read_file
      - write_file
      - edit_file
      - run_command
      max_turns: 8
search:
  provider: auto
  brave_api_key: ''
  serper_api_key: ''
  tavily_api_key: ''
  language: en
  country: us
  min_relevance: 0.2
  timeout_seconds: 12
mcp:
  servers:
  - id: SkillMD.com
    transport: streamable_http
    command:
    - https://api.skillmd.com/mcp
    url: https://api.skillmd.com/mcp
    enabled: true
    headers: {}
  - id: gortex
    transport: streamable_http
    command: []
    url: http://gortex:7411/mcp
    enabled: false
    headers:
      Authorization: Bearer claudio-gortex-internal-token
monitoring:
  log_level: INFO
  log_retention_days: 7
  metrics_snapshot_interval_seconds: 5
autonomous:
  enabled: false
  report_only: true
  max_fix_attempts: 3
  health_check:
    enabled: true
    interval_minutes: 10
    disk_warn_percent: 85
    disk_crit_percent: 95
    mem_crit_percent: 95
    swap_warn_percent: 80
    load_warn_factor: 1
    load_crit_factor: 2
    backup_path: ''
    backup_max_age_hours: 26
    journal_lookback_minutes: 15
    script: ''
  maintenance:
    enabled: false
    schedule: 0 3 * * *
    vacuum_size: 200M
    temp_dirs:
    - /tmp
    - /var/tmp
    audit_retention_days: 90
    apt_update: true
    vacuum_logs: true
    temp_cleanup: true
    autoremove: true
    full_upgrade: false
    docker_prune: false
    script: ''
  recovery:
    enabled: false
    expected_services: []
    restart_allowlist: []
  notification:
    enabled: false
    email:
      enabled: false
      smtp_host: ''
      smtp_port: 587
      username: ''
      password: ''
      from_addr: ''
      to_addr: ''
      use_tls: true
    webhook:
      enabled: false
      url: ''
  command_allowlist: null
self_improvement:
  enabled: true
  capture_enabled: true
  consolidation_schedule: 0 4 * * 1
  promotion_threshold: 3
  auto_promote: false
  max_learnings: 5000
  retention_days: 180
  max_auto_skills: 20
engine:
  kind: adk
  startup_timeout_seconds: 30
  run_timeout_seconds: 1800
  opencode:
    model: null
    config_dir: null
    server_mode: standalone
    binary: opencode
    provider_name: claudio
    output_token_limit: 16000
    context_token_limit: 131072
  claude_code:
    model: null
    config_dir: null
    permission_mode: acceptEdits
    binary: claude
    allow_openai_endpoint: false
