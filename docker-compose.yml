name: clams

x-clams-env: &clams-env
  # In-container wiring; overrides .env (which keeps host-dev defaults
  # and secrets). Volumes: clams-db -> /data, worktrees -> /work.
  CLAMS_DATA_DIR: /data
  CLAMS_DB_PATH: /data/clams.db
  CLAMS_WORK_ROOT: /work
  CLAMS_CLAUDIO_WORKSPACE_ROOT: /work
  CLAMS_REDIS_URL: redis://redis:6379/0
  # Must bind all interfaces inside the container, or docker's port
  # forwarding can't reach it; the host mapping keeps it loopback-only.
  CLAMS_API_HOST: 0.0.0.0
  CLAMS_CLAUDIO_PLANNER_URL: http://claudio-planner:8100
  CLAMS_CLAUDIO_EXECUTOR_URL: http://claudio-executor:8100
  # git credential helper for task-branch pushes (executor-runner mounts
  # config/clams-gitconfig); harmless where no git runs.
  GIT_CONFIG_GLOBAL: /etc/clams-gitconfig

x-clams: &clams
  image: clams:local
  build: .
  env_file: .env
  environment: *clams-env
  restart: unless-stopped
  networks: [clams]

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    networks: [clams]
    restart: unless-stopped

  claudio-planner:
    image: ${CLAUDIO_IMAGE:-claudio/agent:latest}
    # locally built from the claudio repo — not on any registry, so
    # `clamsctl rebuild`'s pull step must skip it
    pull_policy: never
    ports: ["1072:8100"]
    env_file: .env.claudio-planner
    volumes:
      - claudio-sessions:/sessions
      # transcripts live here — without this a rebuild wipes every session
      - claudio-planner-data:/srv/claudio/claudio-backend/data
      # image config wins over env vars; bind our copy (raised run deadline).
      # Mount the DIRECTORY, not the file: claudio persists UI config edits
      # (e.g. agent name) by rename() over config.yaml, which fails EBUSY
      # when the file itself is a bind mount.
      - ./config/agents/planner:/srv/claudio/claudio-backend/config
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/healthz').status==200 else 1)"]
      interval: 15s
      retries: 5
    networks:
      clams: {}
      # alias so the stock claudio/web nginx upstream (claudio-agent:8100)
      # resolves to THIS backend — the single UI's default (planner) backend
      ui-planner: { aliases: [claudio-agent] }
    restart: unless-stopped

  claudio-executor:
    # executor-side agent: derived image with pytest for evidence-gate runs
    image: ${CLAUDIO_EXECUTOR_IMAGE:-claudio/agent-exec:latest}
    pull_policy: never
    ports: ["1073:8100"]
    env_file: .env.claudio-executor
    volumes:
      - claudio-sessions:/sessions
      # transcripts live here — without this a rebuild wipes every session
      - claudio-executor-data:/srv/claudio/claudio-backend/data
      - worktrees:/work
      # image config wins over env vars; bind our copy so /work is an allowed
      # root. Directory mount — see planner note re: rename()/EBUSY.
      - ./config/agents/executor:/srv/claudio/claudio-backend/config
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/healthz').status==200 else 1)"]
      interval: 15s
      retries: 5
    networks:
      clams: {}
    restart: unless-stopped

  # Single Claudio web UI on 1076. Its nginx proxies same-origin /api to
  # claudio-agent (alias -> claudio-planner). To drive the executor, set the
  # backend URL to http://localhost:1073 in the UI's backend settings
  # (direct mode; both agents' CORS already allow the 1076 origin). The UI
  # token is the selected agent's server.auth_token.
  claudio-ui:
    image: ${CLAUDIO_WEB_IMAGE:-claudio/web:latest}
    pull_policy: never
    ports: ["1076:8080"]
    depends_on:
      claudio-planner: {condition: service_healthy}
    networks: [ui-planner]
    restart: unless-stopped

  planner:
    <<: *clams
    command: ["planner"]
    volumes: [clams-db:/data]
    depends_on:
      redis: {condition: service_healthy}
      claudio-planner: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "clams", "healthcheck", "planner"]
      interval: 20s
      retries: 3

  executor-runner:
    <<: *clams
    command: ["executor"]
    volumes:
      - worktrees:/work
      # git credential helper for pushing task branches (GIT_CONFIG_GLOBAL)
      - ./config/clams-gitconfig:/etc/clams-gitconfig:ro
    depends_on:
      redis: {condition: service_healthy}
      claudio-executor: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "clams", "healthcheck", "executor"]
      interval: 20s
      retries: 3

  # Second executor slot. executor_capacity is a Redis prefetch count, not
  # concurrency — a runner executes one task at a time — so parallelism comes
  # from a second runner container with its own CLAMS_EXECUTOR_ID (distinct
  # row in the executors table, separately probed by the watchdog). The
  # halogen LLM server has 4 slots; add more runners here to use the rest.
  executor-runner-2:
    <<: *clams
    command: ["executor"]
    environment:
      <<: *clams-env
      CLAMS_EXECUTOR_ID: executor-2
    volumes:
      - worktrees:/work
      # git credential helper for pushing task branches (GIT_CONFIG_GLOBAL)
      - ./config/clams-gitconfig:/etc/clams-gitconfig:ro
    depends_on:
      redis: {condition: service_healthy}
      claudio-executor: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "clams", "healthcheck", "executor"]
      interval: 20s
      retries: 3

  api:
    <<: *clams
    command: ["api"]
    # rw on clams-db is required: the API's only write is INSERT into commands
    volumes: [clams-db:/data, claudio-sessions:/sessions:ro]
    ports: ["0.0.0.0:1075:8200"]
    depends_on:
      planner: {condition: service_healthy}

networks: {clams: {}, ui-planner: {}}
volumes: {clams-db: {}, redis-data: {}, claudio-sessions: {}, claudio-planner-data: {}, claudio-executor-data: {}, worktrees: {}}
