name: clams

x-clams: &clams
  image: clams:local
  build: .
  env_file: .env
  environment:
    # In-container wiring; overrides .env (which keeps host-dev defaults
    # and secrets). Volumes: clams-db -> /data, worktrees -> /work.
    CLAMS_DATA_DIR: /data
    CLAMS_DB_PATH: /data/clams.db
    CLAMS_WORK_ROOT: /work
    CLAMS_CLAUDIO_WORKSPACE_ROOT: /work
    CLAMS_REDIS_URL: redis://redis:6379/0
    # Must bind all interfaces inside the container, or docker's port
    # forwarding can't reach it; the host mapping keeps it loopback-only.
    CLAMS_API_HOST: 0.0.0.0
    CLAMS_CLAUDIO_PLANNER_URL: http://claudio-planner:8100
    CLAMS_CLAUDIO_EXECUTOR_URL: http://claudio-executor:8100
  restart: unless-stopped
  networks: [clams]

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    networks: [clams]
    restart: unless-stopped

  claudio-planner:
    image: ${CLAUDIO_IMAGE:-claudio/agent:latest}
    env_file: .env.claudio-planner
    volumes:
      - claudio-sessions:/sessions
      # image config wins over env vars; bind our copy (raised run deadline)
      - ./config/claudio-planner.yaml:/srv/claudio/claudio-backend/config/config.yaml
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/healthz').status==200 else 1)"]
      interval: 15s
      retries: 5
    networks: [clams]
    restart: unless-stopped

  claudio-executor:
    image: ${CLAUDIO_IMAGE:-claudio/agent:latest}
    env_file: .env.claudio-executor
    volumes:
      - claudio-sessions:/sessions
      - worktrees:/work
      # image config wins over env vars; bind our copy so /work is an allowed root
      - ./config/claudio-executor.yaml:/srv/claudio/claudio-backend/config/config.yaml
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/healthz').status==200 else 1)"]
      interval: 15s
      retries: 5
    networks: [clams]
    restart: unless-stopped

  planner:
    <<: *clams
    command: ["planner"]
    volumes: [clams-db:/data]
    depends_on:
      redis: {condition: service_healthy}
      claudio-planner: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "clams", "healthcheck", "planner"]
      interval: 20s
      retries: 3

  executor-runner:
    <<: *clams
    command: ["executor"]
    volumes: [worktrees:/work]
    depends_on:
      redis: {condition: service_healthy}
      claudio-executor: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "clams", "healthcheck", "executor"]
      interval: 20s
      retries: 3

  api:
    <<: *clams
    command: ["api"]
    # rw on clams-db is required: the API's only write is INSERT into commands
    volumes: [clams-db:/data, claudio-sessions:/sessions:ro]
    ports: ["127.0.0.1:8200:8200"]
    depends_on:
      planner: {condition: service_healthy}

networks: {clams: {}}
volumes: {clams-db: {}, redis-data: {}, claudio-sessions: {}, worktrees: {}}
